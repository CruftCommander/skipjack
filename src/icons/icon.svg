<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Skipjack's icon: a jump over the sponsor read in a video's progress bar.
       After editing, run `npm run icons` to regenerate the PNGs next to this file. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#13294B"/>
  <!-- Progress bar: watched, the sponsor read, still to come. -->
  <rect x="16" y="84" width="96" height="14" rx="7" fill="#FFFFFF" fill-opacity=".35"/>
  <rect x="16" y="84" width="26" height="14" rx="7" fill="#FFFFFF"/>
  <rect x="46" y="84" width="36" height="14" rx="3" fill="#FF7A59"/>
  <!-- The jump over it. -->
  <path d="M30 74 C30 30 88 26 94 60" stroke="#FFB547" stroke-width="11" fill="none" stroke-linecap="round"/>
  <path d="M80 56 L108 56 L94 78 Z" fill="#FFB547" stroke="#FFB547" stroke-width="2" stroke-linejoin="round"/>
</svg>
